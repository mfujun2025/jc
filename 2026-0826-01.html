<script>

    },
    {
        title: "钢卷尺I级II级精度标准解读，工程测量怎么选",
        url: "2026-0826-02.html",
        date: "2026-08-25",
        desc: "讲解钢卷尺国家精度等级I级、II级的误差范围，工程测绘、装修施工如何挑选符合标准精度的钢卷尺。"
    },
    {
        title: "加厚耐磨钢卷尺有哪些优势，适合什么场景",
        url: "2026-0826-03.html",
        date: "2026-08-24",
        desc: "加厚尺带卷尺抗弯折、抗摔，适合工地高频使用，对比普通卷尺，讲清楚优缺点以及适合购买人群。"
    },
    {

        url: "2026-0826-04.html",
        date: "2026-08-23",

    {
        title: "钢卷尺常见故障：卡尺、回弹无力维修保养技巧",

    },
    {
        title: "卷尺外壳材质对比：ABS、橡胶包胶外壳哪个耐用",
        url: "2026-0826-06.html",
        date: "2026-08-21",
        desc: "市面卷尺外壳分硬塑料、橡胶包胶，对比抗摔、防滑、使用寿命，工地使用优先选哪种外壳。"

        url: "2026-0826-07.html",
        date: "2026-08-20",
        desc: "很多人不会看卷尺头部活动卡扣，讲解头部滑动原理，正确读数方法，减少测量误差。"
    },

        date: "2026-08-19",

    }
];

// 分页配置：每页6篇
const pageSize = 6;
let nowPage = 1;

// 读取URL分页参数 ?page=2
let urlPage = new URLSearchParams(location.search).get('page');
if(urlPage) nowPage = parseInt(urlPage);

// 渲染文章列表
function renderList(){
    const box = document.getElementById('articleBox');
    let start = (nowPage - 1) * pageSize;
    let end = start + pageSize;
    let currList = articleData.slice(start, end);

    let html = '<h2 style="margin-bottom:20px;color:#16325c;">最新资讯</h2>';
    currList.forEach(item=>{
        html += `
        <div class="art-card">
            <h2><a href="${item.url}">${item.title}</a></h2>
            <div class="art-meta">发布时间：${item.date}</div>
            <p class="art-desc">${item.desc}</p>
            <a href="${item.url}" class="read-more">查看全文 →</a>
        </div>
        `;
    });
    box.innerHTML = html;
}

// 分页按钮
function renderPage(){
    const pageBox = document.getElementById('pageBox');
    const totalPage = Math.ceil(articleData.length / pageSize);
    let pageHtml = '';

    if(nowPage > 1){
        pageHtml += `<a href="?page=${nowPage-1}">上一页</a>`;
    }
    for(let i=1;i<=totalPage;i++){
        if(i === nowPage){
            pageHtml += `<a class="active">${i}</a>`;
        }else{
            pageHtml += `<a href="?page=${i}">${i}</a>`;
        }
    }
    if(nowPage < totalPage){
        pageHtml += `<a href="?page=${nowPage+1}">下一页</a>`;
    }
    pageBox.innerHTML = pageHtml;
}

// 侧边热门（取最新3篇）
function renderHot(){
    const hotBox = document.getElementById('hotBox');
    const hotList = articleData.slice(0,3);
    let html = '';
    hotList.forEach(item=>{
        html += `<li><a href="${item.url}">${item.title}</a></li>`;
    });
    hotBox.innerHTML = html;
}

// 初始化
renderList();
renderPage();
renderHot();
</script>
